<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPREME AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif}
header{padding:16px;border-bottom:1px solid #292929;color:#d6b35b;font-weight:bold;font-size:22px;display:flex;justify-content:space-between}
main{max-width:900px;margin:auto;padding:15px}
#chat{height:62vh;overflow:auto;border:1px solid #252525;border-radius:12px;padding:15px}
.msg{padding:12px;margin:12px 0;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#242424}
.ai{background:#141414;border:1px solid #303030}
.controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
textarea{flex:1;min-width:180px;min-height:65px;background:#171717;color:white;border:1px solid #333;border-radius:10px;padding:12px}
button,select,input{background:#181818;color:#d6b35b;border:1px solid #444;padding:12px;border-radius:10px}
button{cursor:pointer}
button:disabled{opacity:.5}
#fileinfo{font-size:13px;color:#aaa;margin:8px}
footer{text-align:center;color:#777;margin:20px;font-size:12px}
</style>
</head>
<body>
<header><span>♤ SUPREME AI</span><button onclick="newChat()">＋ New chat</button></header>
<main>
<div class="controls">
<select id="mode">
<option value="general">General</option><option value="coding">Coding</option><option value="learning">Learning</option><option value="writing">Writing</option><option value="creative">Creative</option>
</select>
<button onclick="restoreChat()">Restore saved</button><button onclick="exportChat()">Export chat</button>
</div>
<div id="chat"></div>
<div class="controls"><input id="file" type="file" accept=".txt,.pdf,text/plain,application/pdf"><button onclick="uploadFile()">Attach file</button></div>
<div id="fileinfo"></div>
<div class="controls"><textarea id="input" placeholder="Ask SUPREME AI anything..."></textarea><button id="sendBtn" onclick="send()">Send</button></div>
</main>
<footer>SUPREME AI • powered by SUPREME DEV</footer>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),mode=document.getElementById('mode');
let history=[],attachedText='',attachedName='';

function save(){
 try{localStorage.setItem('supreme_ai_history',JSON.stringify(history))}catch(e){}
}
function add(role,text){
 const d=document.createElement('div');
 d.className='msg '+(role==='user'?'user':'ai');
 d.textContent=(role==='user'?'You: ':'SUPREME AI: ')+text;
 chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}
function restoreChat(){
 try{
  history=JSON.parse(localStorage.getItem('supreme_ai_history')||'[]');
  chat.innerHTML='';
  history.forEach(m=>add(m.role,m.content));
 }catch(e){alert('Saved chat could not be restored.')}
}
async function uploadFile(){
 const f=document.getElementById('file').files[0];
 if(!f)return alert('Choose a file first.');
 const fd=new FormData();fd.append('file',f);
 document.getElementById('fileinfo').textContent='Reading file...';
 try{
  const r=await fetch('/api/upload',{method:'POST',body:fd}),d=await r.json();
  if(!r.ok)throw Error(d.error||'Upload failed');
  attachedText=d.content;attachedName=d.filename;
  document.getElementById('fileinfo').textContent='Attached: '+attachedName;
 }catch(e){document.getElementById('fileinfo').textContent=e.message}
}
async function send(){
 const text=input.value.trim();if(!text&&!attachedText)return;
 const message=attachedText?'File: '+attachedName+'\n'+attachedText+'\nQuestion: '+text:text;
 add('user',text+(attachedText?' [File: '+attachedName+']':''));
 input.value='';
 const btn=document.getElementById('sendBtn');btn.disabled=true;
 try{
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,mode:mode.value,history})});
  const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');
  add('assistant',d.reply);history.push({role:'user',content:message},{role:'assistant',content:d.reply});
  history=history.slice(-20);save();
  attachedText='';attachedName='';document.getElementById('fileinfo').textContent='';document.getElementById('file').value='';
 }catch(e){add('assistant','Error: '+e.message)}
 btn.disabled=false;
}
function exportChat(){
 const data=history.map(m=>m.role.toUpperCase()+':\\n'+m.content).join('\\n\\n');
 const blob=new Blob([data],{type:'text/plain'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='supreme-ai-chat.txt';a.click();
 URL.revokeObjectURL(a.href);
}
function newChat(){
 history=[];chat.innerHTML='';attachedText='';attachedName='';
 document.getElementById('fileinfo').textContent='';document.getElementById('file').value='';
 save();
}
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
restoreChat();
</script>
</body>
</html>
