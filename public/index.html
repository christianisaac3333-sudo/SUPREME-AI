<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>SUPREME AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#eee;font-family:system-ui,-apple-system,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{padding:18px 20px;border-bottom:1px solid #242424;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;letter-spacing:2px;color:#d9b65b;font-size:20px}
.status{font-size:12px;color:#999}
main{flex:1;overflow:auto;padding:20px;max-width:900px;width:100%;margin:auto}
#welcome{text-align:center;margin-top:15vh}
#welcome h1{font-size:clamp(30px,6vw,48px);margin-bottom:10px}
.gold{color:#d9b65b}
#welcome p{color:#888}
#messages{display:flex;flex-direction:column;gap:18px}
.msg{padding:15px 17px;border-radius:18px;max-width:90%;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:#252525}
.ai{align-self:flex-start;background:#121212;border:1px solid #262626}
#composer{width:100%;max-width:900px;margin:auto;padding:12px 15px 20px}
form{display:flex;gap:10px;background:#151515;border:1px solid #333;border-radius:22px;padding:10px}
textarea{flex:1;background:transparent;color:white;border:0;outline:none;resize:none;font:inherit;max-height:150px;min-height:44px;padding:10px}
button{background:#d9b65b;color:#090909;border:0;border-radius:15px;padding:12px 18px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.small{text-align:center;color:#777;font-size:11px;padding-top:10px}
#newchat{background:transparent;color:#d9b65b;border:1px solid #333}
</style>
</head>
<body>
<header>
<div class="logo">♤ SUPREME AI</div>
<button id="newchat" onclick="newChat()">New chat</button>
</header>
<main id="main">
<div id="welcome">
<h1>Welcome to <span class="gold">SUPREME AI</span></h1>
<p>Your intelligent assistant.</p>
</div>
<div id="messages"></div>
</main>
<div id="composer">
<form id="form">
<textarea id="input" placeholder="Ask SUPREME AI anything..." rows="1"></textarea>
<button id="send" type="submit">Send</button>
</form>
<div class="small">SUPREME AI · AI responses may contain errors</div>
</div>
<script>
const form=document.getElementById('form');
const input=document.getElementById('input');
const messages=document.getElementById('messages');
const welcome=document.getElementById('welcome');
const main=document.getElementById('main');
const send=document.getElementById('send');

function addMessage(text,role){
  const div=document.createElement('div');
  div.className='msg '+role;
  div.textContent=text;
  messages.appendChild(div);
  main.scrollTop=main.scrollHeight;
  return div;
}

async function sendMessage(text){
  if(!text.trim()||send.disabled)return;
  welcome.style.display='none';
  addMessage(text,'user');
  input.value='';
  send.disabled=true;
  const thinking=addMessage('SUPREME AI is thinking...','ai');

  try{
    const res=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text})
    });
    const data=await res.json();
    thinking.textContent=data.reply||data.error||'No response received.';
  }catch(e){
    thinking.textContent='Unable to connect to the server. Please try again.';
  }finally{
    send.disabled=false;
    input.focus();
    main.scrollTop=main.scrollHeight;
  }
}

form.addEventListener('submit',e=>{
  e.preventDefault();
  sendMessage(input.value);
});

input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    form.requestSubmit();
  }
});

function newChat(){
  messages.innerHTML='';
  welcome.style.display='block';
  input.value='';
  input.focus();
}
</script>
</body>
</html>
